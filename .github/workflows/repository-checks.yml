name: Repository Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Validate repository foundation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required repository files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "CODE_OF_CONDUCT.md"
            "SUPPORT.md"
            "ROADMAP.md"
            ".gitignore"
            ".github/PULL_REQUEST_TEMPLATE.md"
            ".github/dependabot.yml"
          )

          missing=0

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required repository file is missing."
              missing=1
            else
              echo "Found: $file"
            fi
          done

          exit "$missing"

      - name: Check for accidentally committed sensitive file types
        shell: bash
        run: |
          set -euo pipefail

          patterns=(
            "*.pfx"
            "*.p12"
            "*.pem"
            "*.key"
            "*.sqlite"
            "*.sqlite3"
            "*.db"
            "*.codeplug"
          )

          found=0

          for pattern in "${patterns[@]}"; do
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              echo "::error file=$file::Potentially sensitive or local-only file type is committed."
              found=1
            done < <(git ls-files "$pattern")
          done

          exit "$found"
